apiVersion: apps/v1 
kind: Deployment 
metadata: 
name: html-demo 
spec: 
replicas: 2 
  selector: 
    matchLabels: 
      app: html-demo 
  template: 
    metadata: 
      labels: 
        app: html-demo 
    spec: 
      containers: 
      - name: html-demo 
        image: <<dockerhus_username>>/html-demo:latest 
        ports: 
        - containerPort: 80 
 --- 
apiVersion: v1 
kind: Service 
metadata: 
  name: html-demo-service 
spec: 
  type: NodePort 
  selector: 
    app: html-demo 
  ports: 
  - port: 80 
    targetPort: 80 
    nodePort: 30010

maven deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          image: <dockerhub-username>/java-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: java-service
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30008
